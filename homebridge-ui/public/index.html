<style>
  .wc { --bg:#ffffff; --card:#f6f8fb; --fg:#0f172a; --sub:#64748b; --line:#e2e8f0; --acc:#0284c7; --accfg:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif; color:var(--fg); max-width:980px; margin:0 auto; padding:4px 2px 90px; }
  @media (prefers-color-scheme: dark){ .wc{ --bg:#0b1220; --card:#131c2e; --fg:#e5e7eb; --sub:#94a3b8; --line:#243049; --acc:#38bdf8; --accfg:#04202e; } }
  .wc *{ box-sizing:border-box; }
  .wc h2{ font-size:15px; margin:26px 0 10px; text-transform:uppercase; letter-spacing:.06em; color:var(--sub); font-weight:700; }
  .wc .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .wc .top h1{ font-size:22px; margin:0; }
  .wc .seg{ display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap; }
  .wc .seg button{ border:0; background:transparent; color:var(--fg); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:13px; }
  .wc .seg button.on{ background:var(--acc); color:var(--accfg); font-weight:600; }
  .wc .stage{ position:relative; width:100%; aspect-ratio:1300/900; border-radius:16px; overflow:hidden; border:1px solid var(--line); background:#0b1b2b; }
  .wc .map{ position:absolute; inset:0; background:
      radial-gradient(ellipse 22% 18% at 38% 46%, rgba(250,204,21,.85), rgba(34,197,94,.7) 45%, transparent 70%),
      radial-gradient(ellipse 14% 12% at 66% 62%, rgba(239,68,68,.8), rgba(250,204,21,.65) 45%, transparent 72%),
      radial-gradient(ellipse 26% 20% at 58% 30%, rgba(59,130,246,.65), transparent 70%),
      linear-gradient(135deg,#17324a,#0f2236 55%,#16314a); }
  .wc .map:after{ content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px); background-size:8.33% 12.5%; }
  .wc .scaler{ position:absolute; left:0; top:0; width:1300px; height:900px; transform-origin:0 0; }
  .wc .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .wc .tpl{ border:2px solid var(--line); background:var(--card); border-radius:14px; padding:8px; cursor:pointer; text-align:start; color:var(--fg); }
  .wc .tpl:hover{ border-color:var(--acc); }
  .wc .tpl.on{ border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 25%, transparent); }
  .wc .tpl .stage{ border-radius:10px; }
  .wc .tpl .nm{ margin:8px 2px 2px; font-size:14px; font-weight:600; display:flex; justify-content:space-between; }
  .wc .mcard{ border:2px solid var(--line); background:var(--card); border-radius:14px; padding:8px; cursor:pointer; text-align:start; color:var(--fg); }
  .wc .mcard.on{ border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 25%, transparent); }
  .wc .mcard .ms{ position:relative; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:#1b2330; }
  .wc .mcard .ms .mm{ position:absolute; left:0; top:0; width:200%; aspect-ratio:1; display:grid; grid-template-columns:1fr 1fr; }
  .wc .mcard .ms .mm img{ width:100%; height:100%; display:block; }
  .wc .mcard .ms .pin{ position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:#4f8cff; border:2px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.35); z-index:2; }
  .wc .mcard .ms:after{ content:""; position:absolute; inset:0; background:radial-gradient(ellipse 22% 26% at 34% 38%, rgba(250,204,21,.8), rgba(34,197,94,.65) 50%, transparent 72%), radial-gradient(ellipse 14% 17% at 52% 70%, rgba(239,68,68,.75), rgba(250,204,21,.6) 50%, transparent 72%); }
  .wc .mcard .nm{ margin:8px 2px 2px; font-size:14px; font-weight:600; }
  .wc .rows{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
  .wc .box{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .wc .box label.t{ display:block; font-size:13px; font-weight:600; margin-bottom:8px; }
  .wc .box .hint{ color:var(--sub); font-size:12px; margin-top:6px; }
  .wc select,.wc input[type=text],.wc input[type=number]{ width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font-size:14px; }
  .wc input[type=range]{ width:100%; accent-color:var(--acc); }
  .wc .pos{ display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,34px); gap:5px; }
  .wc .pos button{ border:1px solid var(--line); background:var(--bg); border-radius:8px; cursor:pointer; }
  .wc .pos button.on{ background:var(--acc); border-color:var(--acc); }
  .wc .pos button[disabled]{ opacity:.25; cursor:default; }
  .wc .sw{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:14px; }
  .wc .sw input{ width:20px; height:20px; accent-color:var(--acc); }
  .wc .bar{ position:fixed; left:0; right:0; bottom:0; padding:12px 18px; display:flex; gap:10px; justify-content:flex-end; background:var(--bg); border-top:1px solid var(--line); z-index:20; }
  .wc .btn{ border:1px solid var(--line); background:var(--card); color:var(--fg); padding:10px 18px; border-radius:10px; cursor:pointer; font-size:14px; }
  .wc .btn.pri{ background:var(--acc); color:var(--accfg); border-color:var(--acc); font-weight:700; }
  .wc .note{ color:var(--sub); font-size:12px; margin-top:8px; }
</style>
